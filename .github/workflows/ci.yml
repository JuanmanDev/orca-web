name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm's store lives in the workspace so actions/cache can persist it.
  PNPM_STORE: .pnpm-store

jobs:
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Reads the packageManager field from package.json.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Protocol E2E (mock runtime)
        run: pnpm test:e2e

      - name: Client E2E (real OrcaRuntimeClient vs mock)
        run: pnpm test:client-e2e

      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orca-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run --rm -d --name orca-web-ci -p 3000:3000 orca-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "container is serving"
              docker stop orca-web-ci
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs orca-web-ci
          docker stop orca-web-ci
          exit 1
