name: Release Docker

# CI/CD: on every tag push (vX.Y.Z) build the production image and publish it
# to the GitHub Container Registry (ghcr.io/<owner>/orca-web). The release
# workflow only runs after CI passes on main.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-docker-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before release
    # Same-commit reusable workflow — no ref, resolves to this tag's ci.yml.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # workflow_dispatch isn't a ref event type; a manual dispatch
          # passes its tag via inputs.tag, appended as an extra raw tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release summary
        run: |
          echo "## Docker release published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ---- |" >> $GITHUB_STEP_SUMMARY
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            echo "| ${{ inputs.tag || github.ref_name }} | \`$tag\` |" >> $GITHUB_STEP_SUMMARY
          done
