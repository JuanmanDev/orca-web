# orca-web — self-hosted web client for the Orca agent runtime.

services:
  orca-web:
    build: .
    image: ghcr.io/JuanmanDev/orca-web:latest
    container_name: orca-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      # Optional: none required — pairing happens in the browser.
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
